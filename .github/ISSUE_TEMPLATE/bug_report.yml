name: Bug report
description: Report a problem with the directive
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please fill out the details below.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Steps or a minimal reproduction (a StackBlitz link is ideal).
      placeholder: |
        1. Add `trackEvent` to ...
        2. Trigger ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: lib-version
    attributes:
      label: Library version
      placeholder: e.g. 1.2.0
    validations:
      required: true
  - type: input
    id: angular-version
    attributes:
      label: Angular version
      placeholder: e.g. 22.0.0
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Adapter used (Mixpanel, Segment, GA4, ...), console errors, screenshots, etc.
    validations:
      required: false
